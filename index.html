<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Point-Trajectory Forecast — EgoDex ball/base demo</title>
<style>
  :root { --fg:#333; --muted:#888; --line:#e2e2e2; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         background:#fafafa; color:var(--fg); padding:18px 22px; }
  h1 { font-size:17px; font-weight:600; margin-bottom:2px; }
  #action { font-size:14px; color:var(--muted); margin-bottom:12px; }
  #runs { margin-bottom:12px; }
  #runs button { font-size:13px; padding:4px 12px; margin-right:6px; border:1px solid var(--line);
                 border-radius:5px; background:#fff; color:var(--fg); cursor:pointer; }
  #runs button.active { background:#333; color:#fff; border-color:#333; }
  .cols { display:flex; gap:16px; flex-wrap:wrap; }
  .panel { background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; }
  .panel h2 { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase;
              letter-spacing:.05em; margin-bottom:8px; }
  #left { flex:0 1 460px; }
  #overlay { width:100%; border-radius:4px; display:block; background:#000; }
  #framestrip { display:flex; gap:6px; margin-top:10px; }
  #framestrip figure { flex:1; }
  #framestrip img { width:100%; border-radius:3px; display:block; }
  #framestrip figcaption { font-size:11px; color:var(--muted); text-align:center; margin-top:3px; }
  #right { flex:1 1 520px; min-width:380px; }
  #three { width:100%; height:420px; border-radius:4px; overflow:hidden; }
  #controls { display:flex; align-items:center; gap:10px; margin-top:10px; }
  #play { width:34px; height:28px; border:1px solid var(--line); border-radius:5px;
          background:#fff; cursor:pointer; font-size:12px; }
  #scrub { flex:1; }
  #tlabel { font-size:12px; color:var(--muted); min-width:86px; text-align:right;
            font-variant-numeric:tabular-nums; }
  #hint { font-size:11px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<h1>3D Point-Trajectory Forecast — EgoDex ball/base demo</h1>
<div id="action"></div>
<div id="runs"></div>
<div class="cols">
  <div id="left" class="panel">
    <h2>Predicted 2D overlay (t&#8320; frame)</h2>
    <video id="overlay" muted playsinline preload="auto"></video>
    <h2 style="margin-top:12px">Input history frames</h2>
    <div id="framestrip">
      <figure><img id="f0"><figcaption>t&#8722;2</figcaption></figure>
      <figure><img id="f1"><figcaption>t&#8722;1</figcaption></figure>
      <figure><img id="f2"><figcaption>t&#8320;</figcaption></figure>
    </div>
  </div>
  <div id="right" class="panel">
    <h2>Predicted 3D tracks (camera frame, meters)</h2>
    <div id="three"></div>
    <div id="controls">
      <button id="play">&#9654;</button>
      <input id="scrub" type="range" min="0" max="1000" value="0">
      <span id="tlabel"></span>
    </div>
    <div id="hint">drag to orbit &middot; scroll to zoom &middot; right-drag to pan &middot; history in blue, prediction in magma gradient</div>
  </div>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------- magma colormap (compact 16-stop LUT, linear interp) ----------
const MAGMA = [[0.001,0.000,0.014],[0.044,0.033,0.141],[0.123,0.062,0.302],[0.216,0.061,0.439],
 [0.311,0.076,0.483],[0.404,0.111,0.485],[0.494,0.141,0.479],[0.588,0.169,0.464],
 [0.684,0.196,0.433],[0.774,0.237,0.387],[0.852,0.302,0.335],[0.912,0.389,0.303],
 [0.951,0.489,0.318],[0.975,0.591,0.375],[0.989,0.692,0.462],[0.995,0.790,0.570]];
function magma(t){ t=Math.min(1,Math.max(0,t))*(MAGMA.length-1);
  const i=Math.floor(t), f=t-i, a=MAGMA[i], b=MAGMA[Math.min(i+1,MAGMA.length-1)];
  return [a[0]+f*(b[0]-a[0]), a[1]+f*(b[1]-a[1]), a[2]+f*(b[2]-a[2])]; }

// ---------- scene ----------
const container = document.getElementById('three');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f2);
const camera = new THREE.PerspectiveCamera(45, 1, 0.001, 100);
camera.up.set(0,-1,0);                       // camera-frame: +y is down
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const state = { meta:null, pred:null, hist:null, T:0, playing:false, frac:0,
                predLines:[], histLines:[], dots:null, lastTs:null, duration:4.0 };

function fitRenderer(){
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', fitRenderer);

function disposeGroup(g){ g.traverse(o=>{ if(o.geometry)o.geometry.dispose();
  if(o.material)o.material.dispose(); }); scene.remove(g); }

let world = null;
function buildScene(){
  if (world) disposeGroup(world);
  world = new THREE.Group(); scene.add(world);
  const m = state.meta, P = m.P, F = m.F, H = m.H;
  const lo = m.bounds_min, hi = m.bounds_max;
  const ctr = lo.map((v,i)=>(v+hi[i])/2);
  const span = Math.max(hi[0]-lo[0], hi[1]-lo[1], hi[2]-lo[2]);
  const pad = 0.25*span;

  // faint bounding box + edges
  const boxGeo = new THREE.BoxGeometry(hi[0]-lo[0]+pad, hi[1]-lo[1]+pad, hi[2]-lo[2]+pad);
  const box = new THREE.Mesh(boxGeo, new THREE.MeshBasicMaterial(
      {color:0x8899aa, transparent:true, opacity:0.05, depthWrite:false}));
  box.position.set(...ctr); world.add(box);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo),
      new THREE.LineBasicMaterial({color:0xb9c2cc}));
  edges.position.set(...ctr); world.add(edges);

  // floor grid on the bottom (max-y, since +y is down) + axes at min corner
  const grid = new THREE.GridHelper(span+pad, 10, 0xcccccc, 0xe4e4e4);
  grid.position.set(ctr[0], hi[1]+pad/2, ctr[2]); world.add(grid);
  const axes = new THREE.AxesHelper(0.12*span);
  axes.position.set(lo[0]-pad/2+ (hi[0]-lo[0]+pad)*0, hi[1]+pad/2, lo[2]-pad/2); world.add(axes);

  // tracks: per point, history polyline (blue) + prediction polyline (magma)
  state.predLines = []; state.histLines = [];
  for (let p=0; p<P; p++){
    // history: H points ending at t0
    const hpos = new Float32Array(H*3);
    for (let t=0; t<H; t++) for (let c=0;c<3;c++) hpos[t*3+c] = state.hist[(t*P+p)*3+c];
    const hg = new THREE.BufferGeometry();
    hg.setAttribute('position', new THREE.BufferAttribute(hpos,3));
    const hl = new THREE.Line(hg, new THREE.LineBasicMaterial({color:0x4a7bd0}));
    world.add(hl); state.histLines.push(hl);

    // prediction: t0 anchor + F future points, vertex-colored by time
    const ppos = new Float32Array((F+1)*3), pcol = new Float32Array((F+1)*3);
    for (let c=0;c<3;c++) ppos[c] = state.hist[((H-1)*P+p)*3+c];
    for (let t=0; t<F; t++) for (let c=0;c<3;c++) ppos[(t+1)*3+c] = state.pred[(p*F+t)*3+c];
    for (let t=0; t<=F; t++){ const [r,g,b] = magma(0.15+0.73*t/F);
      pcol[t*3]=r; pcol[t*3+1]=g; pcol[t*3+2]=b; }
    const pg = new THREE.BufferGeometry();
    pg.setAttribute('position', new THREE.BufferAttribute(ppos,3));
    pg.setAttribute('color', new THREE.BufferAttribute(pcol,3));
    pg.setDrawRange(0,1);
    const pl = new THREE.Line(pg, new THREE.LineBasicMaterial({vertexColors:true, linewidth:2}));
    world.add(pl); state.predLines.push(pl);
  }

  // moving dots: round soft sprites
  const cnv = document.createElement('canvas'); cnv.width=cnv.height=64;
  const ctx = cnv.getContext('2d');
  const grad = ctx.createRadialGradient(32,32,4,32,32,30);
  grad.addColorStop(0,'rgba(255,255,255,1)'); grad.addColorStop(0.35,'rgba(250,120,80,0.95)');
  grad.addColorStop(1,'rgba(250,120,80,0)');
  ctx.fillStyle=grad; ctx.fillRect(0,0,64,64);
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(P*3),3));
  state.dots = new THREE.Points(dotGeo, new THREE.PointsMaterial(
      {size:0.035*span, map:new THREE.CanvasTexture(cnv), transparent:true,
       depthWrite:false, sizeAttenuation:true}));
  world.add(state.dots);

  camera.position.set(ctr[0]+0.9*span, ctr[1]-0.55*span, ctr[2]-1.25*span);
  controls.target.set(...ctr); controls.update();
  setFrac(0);
}

// timeline: frac in [0,1] maps over F future steps; drives 3D + the mp4
function setFrac(frac){
  state.frac = frac;
  const m = state.meta, P=m.P, F=m.F, H=m.H;
  const head = frac*F;                      // 0..F
  const ni = Math.floor(head);
  for (let p=0; p<P; p++){
    state.predLines[p].geometry.setDrawRange(0, Math.max(1, ni+1));
    const pos = state.predLines[p].geometry.attributes.position.array;
    const a = Math.min(ni, F-1), b = Math.min(ni+1, F), f = head-ni;
    const dp = state.dots.geometry.attributes.position.array;
    for (let c=0;c<3;c++)
      dp[p*3+c] = pos[a*3+c] + (pos[b*3+c]-pos[a*3+c])*f;
  }
  state.dots.geometry.attributes.position.needsUpdate = true;
  const v = document.getElementById('overlay');
  if (v.duration && !state.playing) v.currentTime = frac*v.duration*0.999;
  document.getElementById('scrub').value = Math.round(frac*1000);
  document.getElementById('tlabel').textContent =
      `t₀ + ${(head).toFixed(1)} / ${F} frames`;
}

// ---------- playback ----------
const playBtn = document.getElementById('play');
const scrub = document.getElementById('scrub');
const video = document.getElementById('overlay');
playBtn.onclick = () => {
  state.playing = !state.playing;
  playBtn.innerHTML = state.playing ? '&#10074;&#10074;' : '&#9654;';
  if (state.playing){ if (state.frac>=1) state.frac=0; video.play(); }
  else video.pause();
};
scrub.oninput = () => { state.playing=false; video.pause();
  playBtn.innerHTML='&#9654;'; setFrac(scrub.value/1000); };

function animate(ts){
  requestAnimationFrame(animate);
  if (state.playing && state.meta){
    if (video.duration) state.frac = video.currentTime/video.duration;
    else { const dt=(ts-(state.lastTs||ts))/1000; state.frac += dt/state.duration; }
    if (state.frac >= 1){ state.frac = 1; state.playing=false; video.pause();
      playBtn.innerHTML='&#9654;'; }
    setFrac(state.frac);
  }
  state.lastTs = ts;
  controls.update();
  renderer.render(scene, camera);
}

// ---------- data loading ----------
async function loadRun(name){
  const base = `data/${name}`;
  const meta = await (await fetch(`${base}/meta.json`)).json();
  const pred = new Float32Array(await (await fetch(`${base}/tracks_pred.bin`)).arrayBuffer());
  const hist = new Float32Array(await (await fetch(`${base}/tracks_hist.bin`)).arrayBuffer());
  state.meta = meta; state.pred = pred; state.hist = hist;
  document.getElementById('action').textContent = `"${meta.action}"  ·  P=${meta.P} points  ·  F=${meta.F} future frames`;
  video.src = `${base}/overlay_2d.mp4`; video.load();
  document.getElementById('f0').src = `${base}/frame_t-2.jpg`;
  document.getElementById('f1').src = `${base}/frame_t-1.jpg`;
  document.getElementById('f2').src = `${base}/frame_t+0.jpg`;
  state.playing = false; playBtn.innerHTML='&#9654;';
  buildScene();
}

async function init(){
  fitRenderer();
  const runs = await (await fetch('data/index.json')).json();
  const bar = document.getElementById('runs');
  runs.forEach((r,i)=>{
    const b = document.createElement('button');
    b.textContent = r.label || r.name;
    b.onclick = ()=>{ bar.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
                      b.classList.add('active'); loadRun(r.name); };
    bar.appendChild(b);
    if (i===0){ b.classList.add('active'); loadRun(r.name); }
  });
  requestAnimationFrame(animate);
}
init();
</script>
</body>
</html>
